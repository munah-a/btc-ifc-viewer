# CI gate (AUDIT T1). Actions pinned to full commit SHAs (AUDIT T9); the
# trailing comment records the tag each SHA was resolved from.
#
# COST / PARITY POLICY (user directive 2026-07-06): the automatic PR gate runs
# only the FAST, deterministic, hardware-independent checks (typecheck, lint,
# unit, audit, build). The heavy Playwright e2e suite is NOT run automatically —
# it converts real IFC models in-browser and is ~24min on GitHub's 2-core
# SwiftShader runner, AND that slow/GPU-less runner is exactly where e2e is
# unreliable (findings T11/T12/T13 were all "passes locally, fails GitHub e2e").
# So e2e is the LOCAL wave-gate (`npm run ci:local`, run by the PO before every
# merge) and is available in GitHub only on manual `workflow_dispatch`.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run the full Playwright e2e suite (~25min on the runner)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  # Heavy browser e2e — manual only (Actions → CI → Run workflow), never on PR.
  # The authoritative e2e gate is local `npm run ci:local` (SwiftShader parity).
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests (production artifact)
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
