# GitHub Pages mirror deploy (Vercel is the primary target — see
# docs/IMPLEMENTATION_PLAN.md W0.6). Actions pinned to full commit SHAs (AUDIT T9).
#
# COST: this runs build-only on merge to main and does NOT re-run the CI/e2e
# suite (user directive 2026-07-06 — GitHub Actions minutes). The merged PR was
# already gated green by ci.yml on pull_request, so re-running it here is pure
# duplicate cost. Direct pushes to main bypass CI by design; keep merges the
# only path to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages mirror serves under the repo subpath (AUDIT P8).
          VITE_BASE: /btc-ifc-viewer/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
